name: Sync Upstream (cutetailbud/ff-ruyijs)

on:
  schedule:
    # 每天凌晨 03:00 (UTC) 自动检查并同步上游
    - cron: '0 3 * * *'
  workflow_dispatch:
    # 支持在 GitHub 网页上手动点击一键运行

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/cutetailbud/ff-ruyijs.git
          git fetch upstream main

      - name: Check for upstream changes
        id: check_upstream
        run: |
          UPSTREAM_REV=$(git rev-parse upstream/main)
          MERGE_BASE=$(git merge-base HEAD upstream/main)
          if [ "$UPSTREAM_REV" = "$MERGE_BASE" ]; then
            echo "Already up-to-date with upstream."
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "Upstream has new commits: $UPSTREAM_REV"
            echo "has_updates=true" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream changes
        if: steps.check_upstream.outputs.has_updates == 'true'
        id: merge
        run: |
          # 尝试自动合并官方 upstream 的更新
          if git merge upstream/main -m "chore(sync): auto-merge upstream changes from cutetailbud/ff-ruyijs"; then
            echo "merge_status=success" >> $GITHUB_OUTPUT
            git push origin main
          else
            echo "merge_status=conflict" >> $GITHUB_OUTPUT
            git merge --abort
            # 冲突时创建独立同步分支并提 PR
            SYNC_BRANCH="sync-upstream-$(date +%Y%m%d%H%M%S)"
            git checkout -b "$SYNC_BRANCH"
            git merge -s recursive -X ours upstream/main -m "chore(sync): merge upstream with conflict resolution branch"
            git push origin "$SYNC_BRANCH"
            echo "sync_branch=$SYNC_BRANCH" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request on Conflict
        if: steps.check_upstream.outputs.has_updates == 'true' && steps.merge.outputs.merge_status == 'conflict'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = "${{ steps.merge.outputs.sync_branch }}";
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Upstream Sync Conflict - Manual Review Required (${new Date().toISOString().split('T')[0]})`,
              head: branch,
              base: 'main',
              body: `官方上游仓库 \`cutetailbud/ff-ruyijs\` 产生了最新更新，由于存在重叠修改，自动合并遇到冲突。\n\n已为您自动创建分支 \`${branch}\` 并开启此 PR，请手动 Review 解决冲突后合入 \`main\`。`
            });
