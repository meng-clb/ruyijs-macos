name: Wheels

# Builds the ruyijs wheels for Windows x64, macOS arm64 and Linux x86_64 from
# the official Firefox release pinned by the firefox/ submodule. Every platform
# uploads its wheel as an artifact of this run; releases are cut from them.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "assets/**"
      - "docs/**"
      - "site/**"
      - "examples/**"
      - "runtime.json"
  workflow_dispatch:

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows
    uses: ./.github/workflows/build-windows.yml
  macos:
    name: macOS
    uses: ./.github/workflows/build-macos.yml
  linux:
    name: Linux
    uses: ./.github/workflows/build-linux.yml
